  page: 2
  expect: exact          # markdown laid out as a PDF; curly apostrophe and em-dash in the source
  at: 2
  lines: [48, 48]        # the line in notes.md itself, worked back from the typed-out page
- file: fixtures/notes.md
  quote: "We agreed to cancel the beta entirely."
  expect: not found
- file: fixtures/make_fixtures.py
