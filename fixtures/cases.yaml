- file: fixtures/formats.xlsx
  quote: "$1,234.50"
  expect: exact          # money as Excel shows it
- file: fixtures/formats.xlsx
  quote: "2100"
  expect: exact          # the stored value, as a script reading the file would print it
- file: fixtures/formats.xlsx
  quote: "6-Jan-24"
  expect: exact          # a date as Excel shows it
- file: fixtures/formats.xlsx
  quote: "31.0%"
  expect: exact
- file: fixtures/formats.xlsx
  quote: "$4,800.00"
  expect: not found
- file: fixtures/formats.xlsx
  quote: "Taxi 3"
  expect: exact          # 2.5 shown with no decimals is 3, as Excel rounds, not 2
- file: fixtures/formats.xlsx
  quote: "Taxi 2"
  expect: not found      # neither what Excel shows nor what is stored
- file: fixtures/formats.xlsx
  quote: "on 9 Jan 0042"
  expect: exact          # quoted words in a date format, and a zero-padded number
- file: fixtures/formats.xlsx
  quote: "2.5"
  expect: exact          # the stored taxi cost, not the 2.5 inside the hotel's 12.5%
  cells: [1]
- file: fixtures/formats.xlsx
  quote: "12.5%"
  expect: exact
  cells: [3]
- file: fixtures/formats.xlsx
  quote: "Taxi 42"
