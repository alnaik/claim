# Each case: file, quote, optional page hint, expect (exact / partial / not found),
# optional `at` = the page the quote really is on (a hit elsewhere counts as confident-wrong),
# optional `lines` = [first, last] line numbers a text file's hit must report,
# optional `cells` = the columns (0 is A) of the matched row's cells that must be lit.

# --- M1: exact matches ---
- file: fixtures/paper.pdf
  quote: "We observe a 12% improvement over the baseline when the retrieval step is enabled."
  page: 2
  expect: exact
  at: 2
  lines: [41, 42]        # the page's own lines, counted from its top
- file: fixtures/paper.pdf
  quote: "the gain disappears entirely once documents are shorter than two hundred words"
  expect: exact          # no page hint, found by scanning the whole document
  at: 3
- file: fixtures/paper.pdf
  quote: "“All experiments were run three times and we report the median of the three runs…”"
  page: 3                # hint is one page off; neighbours are checked next
  expect: exact
  at: 4
- file: fixtures/contract.pdf
  quote: "Either party may terminate this Agreement by giving not less than ninety (90) days' written notice"
  expect: exact
- file: fixtures/report.pdf
  quote: "revenue grew by 10% to 53.9 million, driven mainly by new services contracts"
  page: 1
  expect: exact
  at: 1
- file: fixtures/hyphen.pdf
  quote: "the implementation plan was realistic, although the budget for maintenance looked too optimistic"
  expect: exact          # source splits words with hyphens at line ends
  lines: [1, 4]
- file: fixtures/hyphen.pdf
  quote: "asked the director to resign the contract"
  expect: not found      # the page says "re-sign" mid-line, which is a different word
- file: fixtures/hyphen.pdf
  quote: "re-sign the contract before the co-op meeting"
  expect: exact
- file: fixtures/curly.pdf
  quote: 'the launch was "not a failure - just early" and asked the team to keep going'
  expect: exact          # source uses curly quotes and an em-dash
- file: fixtures/contract.pdf
  quote: "NEITHER PARTY'S TOTAL LIABILITY under this Agreement shall exceed the total fees paid"
  expect: exact          # case-insensitive

# --- M2: rewrites, misses, and things that must not get a green box ---
- file: fixtures/paper.pdf
  quote: "Our results show a twelve percent gain overall. We observe a 12% improvement over the baseline when the retrieval step is enabled."
  page: 2
  expect: partial        # first sentence invented, second is real
  at: 2
- file: fixtures/contract.pdf
  quote: "Interest accrues on any overdue amount at four percent (4%) per year above the base rate, compounded monthly."
  expect: partial        # ending changed; an 8-word run still matches
- file: fixtures/pagebreak.pdf
  quote: "In the end the committee agreed that the budget would be frozen until the spring review."
  expect: partial        # sentence runs across a page break; only the page-1 half can be shown
  at: 1
- file: fixtures/paper.pdf
  quote: "we see roughly a 12 percent improvement over baseline"
  page: 2
  expect: not found      # paraphrased so much that no 8 words in a row survive
- file: fixtures/contract.pdf
  quote: "this sentence does not exist anywhere in the agreement at all"
  page: 2
  expect: not found
- file: fixtures/scanned.pdf
  quote: "This Agreement begins on the Effective Date"
  expect: not found      # picture of text, no OCR
- file: fixtures/missing.pdf
  quote: "anything"
  expect: not found      # file isn't there
- file: fixtures/paper.pdf
  quote: "Future work should test whether the effect holds for languages with rich morphology."
  page: 1
  expect: exact          # hint is four pages off; found on the full scan
  at: 5
- file: fixtures/paper.pdf
  quote: "The model was trained on a large private corpus collected over several years by a team of annotators who were paid hourly and asked to rate each answer on a five point scale for helpfulness, accuracy and tone, and the resulting scores were averaged per item before training. Surprisingly, the gain disappears entirely once documents are shorter than two hundred words. This finding was later confirmed by three independent groups using different data."
  expect: partial        # over 400 characters, so the full-quote search is skipped
  at: 3

# --- M4: other sources ---
- file: fixtures/notes.md
